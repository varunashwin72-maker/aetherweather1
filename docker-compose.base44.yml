# Base44 sandbox environment for AetherWeather.
#
# Runs the Vite dev server straight from the cloned source (bind mount + live
# reload), so edits in the repo appear in the preview without a rebuild.
# The app is a frontend-only SPA: weather data comes from the keyless
# Open-Meteo API in the browser and auth/storage come from a hosted Supabase
# project supplied as secrets (see .env.base44-defaults and AGENTS.md).
services:
  web:
    image: node:22
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec ./node_modules/.bin/vite --host 0.0.0.0 --port 5173 --strictPort
    ports:
      - "3000:5173"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
    environment:
      # Platform-supplied; a bare entry passes the value through when set.
      - BASE44_PREVIEW_MODE
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      # Bind mounts in the sandbox do not always emit inotify events.
      - CHOKIDAR_USEPOLLING=true
    env_file:
      # Placeholders first, platform secrets last so the real values win.
      - path: ./.env.base44-defaults
      - path: /run/base44/app.env
        required: false
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:5173/').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    labels:
      base44.project: "AetherWeather"
      base44.kind: "web"
      base44.port: "3000"

volumes:
  web_node_modules:
